name: Lint test

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Keep in sync with the ruff rev in .pre-commit-config.yaml and requirements/tests.txt.
      - name: Install ruff
        run: pip install ruff==0.13.0
      - name: Linting
        run: |
          ruff check .
          ruff format --check .
