# v5 YAML config: the entire argument set for `swift sft`, as a file instead of a flag list.
#
# Consumed by `swift sft examples/v5/train/yaml/sft.yaml` (see train.sh next to this file). swift/cli/main.py
# parse_yaml_args loads the FIRST positional arg when it ends in .yaml/.yml/.json, then rewrites it into the
# equivalent `--key value` flags before the dev CLI ever sees argv:
#   - a scalar  (model: X)        -> --model X
#   - a list    (dataset: [a, b]) -> --dataset a b        (each item appended)
#   - a dict                      -> --key '<json blob>'  (json.dumps)
# So this file is exactly the lora/train.sh flag set, in YAML. Nothing is YAML-only; it is the same Config.
#
# An optional top-level `ENV:` mapping is popped and written into os.environ (existing vars win). NOTE the one
# thing it CANNOT do: change the CLI version. resolve_route() decides v4-vs-v5 BEFORE parse_yaml_args runs,
# so putting the version switch under ENV here is too late -- v5 is the default; train.sh sets
# CUDA_VISIBLE_DEVICES in the shell, and this file stays pure config.
model: Qwen/Qwen3.5-4B
attn_impl: flash_attention_2
task_type: causal_lm
torch_dtype: bfloat16
dataset:
  - 'swift/self-cognition#600'
tuner: lora
lora_rank: 8
lora_alpha: 32
target_modules:
  - all-linear
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
lr_scheduler: cosine
warmup_ratio: 0.05
max_length: 2048
logging_steps: 5
save_steps: 100
save_total_limit: 2
split_dataset_ratio: 0.01
output_dir: output
report_to: tensorboard
