<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">twinkle-server 服务端与客户端</title><desc id="desc">客户端循环经过 gateway 调用训练，采样和处理应用。服务端 worker 持有 GPU 权重，checkpoint 返回 URI。客户端不加载基础模型权重。</desc>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3566a0"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#277a60"/></marker><style>text{font-family:system-ui,sans-serif;fill:#20354e;font-size:17px}.box{fill:#edf4fb;stroke:#9bb7d0}.c{fill:none;stroke:#3566a0;stroke-width:2;marker-end:url(#b)}.d{fill:none;stroke:#277a60;stroke-width:2;marker-end:url(#g)}.s{fill:none;stroke:#3566a0;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#b)}</style></defs>
<rect width="1000" height="600" rx="16" fill="#fff"/><text x="35" y="38" font-size="23">远程训练：客户端算法，服务端算力</text>
<rect class="box" x="35" y="150" width="230" height="210" rx="10"/><text x="55" y="185">客户端（CPU 即可）</text><text x="55" y="225">SWIFT recipe / 自定义循环</text><text x="55" y="265">数据 / tokenizer / batch</text><text x="55" y="305">twinkle_client / Tinker SDK</text><text x="55" y="340">日志，指标，checkpoint URI</text>
<rect x="365" y="65" width="600" height="460" rx="12" fill="#f7fafc" stroke="#799ab7" stroke-dasharray="7 4"/><text x="390" y="100">twinkle-server：受保护的服务边界 / Ray Serve</text>
<rect class="box" x="390" y="150" width="195" height="210" rx="10"/><text x="410" y="185">Gateway /api/v1</text><text x="410" y="225">session / model handle</text><text x="410" y="265">认证，队列与限流</text><text x="410" y="305">future / 结果查询</text>
<rect class="box" x="660" y="130" width="270" height="85" rx="8"/><text x="680" y="160">Model app / GPU workers</text><text x="680" y="190">base + LoRA + optimizer</text>
<rect class="box" x="660" y="265" width="270" height="75" rx="8"/><text x="680" y="295">Sampler app / GPU workers</text><text x="680" y="322">vLLM / 生成与 logprobs</text>
<rect class="box" x="660" y="390" width="270" height="75" rx="8"/><text x="680" y="420">Processor app / CPU</text><text x="680" y="447">可选数据编码</text>
<path class="c" d="M265 200H390"/><text x="288" y="186">HTTP</text><path class="d" d="M265 285H390"/>
<path class="c" d="M585 175H660"/><path class="c" d="M585 300H660"/><path class="c" d="M585 335H600V375H795V390"/>
<path class="s" d="M795 215V265"/><text x="803" y="245">权重 / adapter URI</text>
<rect class="box" x="390" y="390" width="245" height="105" rx="8"/><text x="410" y="420">服务端 checkpoint 存储</text><text x="410" y="447">twinkle:// URI</text><text x="410" y="476">不是客户端路径</text>
<path class="s" d="M660 205H645V450H635"/><path class="s" d="M390 475H300V340H265"/>
<path class="c" d="M40 562H90"/><text x="100" y="568">控制请求</text><path class="d" d="M300 562H350"/><text x="360" y="568">token / batch / 结果</text><path class="s" d="M620 562H670"/><text x="680" y="568">权重或 checkpoint 引用</text>
</svg>
